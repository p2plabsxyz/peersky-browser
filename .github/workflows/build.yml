# https://github.com/AgregoreWeb/agregore-browser/blob/master/.github/workflows/build.yml

name: Build/release

on:
  push:
    ## Run on tags starting with `v*`
    tags:
      - 'v*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  release:
    # The arm64 build is extra: when it fails, the other builds still finish and publish.
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest, ubuntu-24.04-arm]
        include:
          # Raspberry Pi and other arm64 Linux get the deb only. Installed AppImages
          # update to the first .AppImage in a release, and GitHub lists linux-arm64
          # before linux-x86_64, so an arm64 AppImage would replace x64 installs.
          - os: ubuntu-24.04-arm
            builder_args: --arm64 -c.linux.target=deb

    steps:
      # libarchive-tools: pacman build, https://github.com/electron-userland/electron-builder/issues/4181
      # zsync: provides zsyncmake, which afterAllArtifactBuild uses to emit the
      # AppImage .zsync so updates fetch changed blocks instead of the whole file.
      - name: Install Linux packaging tools
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zsync

      - name: Check out Git repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/jod'

      - name: Non-tag specific build step
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "This build was triggered without a tag."

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies with npm
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: npm ci

      - name: Ensure Electron binary
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          shell: bash
          command: |
            if ! node -e "require('electron')" 2>/dev/null; then
              echo "Electron binary missing — running npm rebuild electron..."
              npm rebuild electron
            fi
            node -e "console.log('Electron path:', require('electron'))"

      - name: Run tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          shell: bash
          command: npm run test:ci

      - name: Run integration test (Windows/macOS)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        timeout-minutes: 10
        run: npm run test:integration

      - name: Build binaries with electron-builder
        uses: coparse-inc/action-electron-builder@29a7606c7d726b5b0f4dc2f334026f58bea0e1bb # v1.6.0 but safer than a tag that can be changed
        with:
          max_attempts: 2
          skip_install: true
          # The action runs `npm run build` first, a full electron-builder run;
          # the arm64 job skips it so only its deb gets built.
          skip_build: ${{ matrix.os == 'ubuntu-24.04-arm' }}
          args: ${{ matrix.builder_args }}
          github_token: ${{ secrets.github_token }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          mac_certs: ${{ secrets.APPLE_CERTIFICATE }}
          mac_certs_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
