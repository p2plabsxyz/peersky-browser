<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>PDF</title>
<link rel="stylesheet" href="browser://theme/vars.css" />
<style>
  body { margin: 0; background: var(--browser-theme-background, #1c1c1c); color: var(--browser-theme-text-color, #eee);
         font-family: var(--browser-theme-font-family, system-ui, sans-serif); }
  #bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
         padding: 8px 14px; background: var(--browser-theme-secondary-background, #262626);
         border-bottom: 1px solid var(--browser-theme-border, #333); font-size: 13px; }
  #bar button { background: transparent; border: 1px solid var(--browser-theme-border, #444); color: inherit;
                border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #bar button:hover { background: var(--browser-theme-primary-highlight, #333); }
  #name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; }
  .page { position: relative; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .page canvas { display: block; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; forced-color-adjust: none; }
  .textLayer span { position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; color: transparent; }
  .textLayer ::selection { background: rgba(0, 120, 255, .4); }
  #status { padding: 24px; opacity: .7; }
</style>
</head>
<body>
  <div id="bar">
    <span id="name"></span>
    <button id="out">&minus;</button>
    <span id="zoom">100%</span>
    <button id="in">+</button>
    <button id="download">Download</button>
  </div>
  <div id="status">Loading…</div>
  <div id="pages"></div>
  <script src="peersky://static/js/pdf-viewer.js" type="module"></script>
</body>
</html>
